# dynaprot_marginal_flexpert.yaml: DynaProt-M (dynaprot_marginal.yaml) retrained on the Flexpert-3D split
# (configs/data/atlas_config_flexpertsplits.yaml) on one GPU: batch 20 x accumulate_grad_batches 4 = 80 proteins
# per optimiser step, the effective batch of the released DynaProt-M (dynaprot_marginal.yaml of upstream e1bc8e9: batch 20
# on 4 GPUs with DDP), with the gradient averaged over the micro-batches as DDP averages over the devices; training stops at max_steps optimiser steps (= total_steps); constant learning rate as
# in the released models (use_lr_schedule unset).

# Model training and testing settings
model_params:
  num_ipa_blocks: 8
  d_model: 128
  use_sinusoidal_pos_emb: true
  marginal_readout_layers: 1

train_params:
  precision: 32
  batch_size: 20
  accumulate_grad_batches: 4
  epochs: 10000
  learning_rate: 0.0001
  warmup_steps: 2000
  total_steps: 20000
  max_steps: 20000
  grad_clip_norm: 1.0
  accelerator: "gpu"
  strategy: "auto"
  num_devices: 1
  num_nodes: 1
  project: "openprot/dynamics"
  tags: ["dynaprot", "debugging","dropout"]
  log_model_checkpoints: True

  out_type: "marginal"

eval_params:    
  loss_weights:  # hyperparameters for loss functions per dynamics readout, if null/0.0 then loss is not used (0.0 will still log the loss)
    resi_gaussians:
      mse_means: 0.0
      mse_covs: 0.0
      kldiv: 0.0
      eigen_penalty: null
      cond_penalty: null
      frob_norm: 0.0
      log_frob_norm: 1.0
      affine_invariant_dist: 0.0
      bures_dist: 0.0
      mse_diag: 0.0

    resi_rmsf:
      corr_sp: 0.0
      corr_pcc: 0.0

    resi_correlations:
      mse: 0.0
      bures_dist: null
      log_frob_norm: 0.0
      
    resi_rmsd: null
    resi_rg: null

# Output paths for model artifacts and logs

checkpoint_path: ""
logs: "/path/to/logs"
results: "/path/to/results"
 
